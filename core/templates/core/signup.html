{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Créer un compte</h1>
<form method="post" class="space-y-4 bg-white p-6 rounded shadow">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">S'inscrire</button>
</form>
{% if form.errors %}
<div class="mt-4 text-red-500">
    <p>Une erreur est survenue. Merci de vérifier les champs du formulaire.</p>
</div>
{% endif %}
{% endblock %}
