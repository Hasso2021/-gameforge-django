{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">🎮 Mes jeux générés</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for game in games %}
    <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-semibold">{{ game.title }}</h2>
        <p class="text-sm text-gray-500">Genre: {{ game.genre }}</p>
        <a href="{% url 'game_detail' game.id %}" class="text-blue-600 hover:underline mt-2 block">Voir le détail</a>
    </div>
    {% empty %}
    <p>Vous n'avez pas encore créé de jeux.</p>
    {% endfor %}
</div>
{% endblock %}
