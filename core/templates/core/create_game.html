{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Créer un nouveau jeu</h1>
<form method="post" class="bg-white shadow rounded p-6 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Générer</button>
</form>
{% endblock %}
